<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                pageReady() {
                    return MathJax.startup.defaultPageReady().then(function () {
                        window.dispatchEvent(new Event('MathJaxReady'));
                    });
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
            font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 13px;
            overflow: hidden;
        }

        #container {
            height: 100vh;
            box-sizing: border-box;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .row {
            display: flex;
            margin: 6px 0;
        }

        .row.user {
            justify-content: flex-end;
        }

        .row.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 480px;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .bubble.user {
            background: #3498db;
            color: white;
        }

        .bubble.ai {
            background: white;
            border: 1px solid #e5e7eb;
            color: #2c3e50;
        }

        /* Markdown */

        .bubble h1,
        .bubble h2,
        .bubble h3,
        .bubble h4 {
            margin: 0.8em 0 0.4em;
            line-height: 1.3;
        }

        .bubble h1:first-child,
        .bubble h2:first-child,
        .bubble h3:first-child,
        .bubble h4:first-child {
            margin-top: 0;
        }

        .bubble p {
            margin: 0.5em 0;
        }

        .bubble ul,
        .bubble ol {
            margin: 0.5em 0 0.5em 1.2em;
            padding: 0;
        }

        .bubble blockquote {
            margin: 0.5em 0;
            padding-left: 10px;
            border-left: 3px solid #d1d5db;
            color: #6b7280;
        }

        .bubble code {
            background: rgba(0, 0, 0, 0.06);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: Consolas, "Courier New", monospace;
        }

        .bubble pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.6em 0;
        }

        .bubble pre code {
            background: transparent;
            padding: 0;
        }

        .bubble table {
            border-collapse: collapse;
            margin: 0.6em 0;
            width: 100%;
        }

        .bubble th,
        .bubble td {
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: left;
        }

        .bubble th {
            background: #f3f4f6;
        }

        /* Thinking */

        .bubble.thinking {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 16px;
        }

        .bubble.thinking .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #bdc3c7;
            animation: thinking-bounce 1.4s infinite ease-in-out both;
        }

        .bubble.thinking .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .bubble.thinking .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes thinking-bounce {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Scrollbar */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body>
<div id="container"></div>
<script>
    var MATH_COMMANDS = [
        'boxed', 'frac', 'sqrt', 'sum', 'int', 'lim', 'prod', 'left', 'right',
        'cdot', 'times', 'div', 'pm', 'mp', 'alpha', 'beta', 'gamma', 'delta',
        'theta', 'pi', 'infty', 'partial', 'nabla', 'hat', 'bar', 'vec',
        'overline', 'underline', 'mathbf', 'mathrm', 'mathbb', 'text',
        'binom', 'overrightarrow'
    ];

    var container = document.getElementById('container');
    var bridge = null;
    var _repaintPending = false;
    var _scrollNotifyPending = false;

    if (typeof qt !== 'undefined' && qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function (channel) {
            bridge = channel.objects.bridge;
        });
    }

    container.addEventListener('wheel', function (e) {
        if (_repaintPending) return;

        _repaintPending = true;
        _scrollNotifyPending = true;

        requestAnimationFrame(function () {
            container.style.opacity = '0.999999';
            _scrollNotifyPending = false;

            requestAnimationFrame(function () {
                bridge.notify_scroll();
                container.style.opacity = '1';
                _repaintPending = false;
            });
        });
    }, {passive: true});

    container.addEventListener('scroll', function () {
        if (_repaintPending) return;

        _repaintPending = true;
        _scrollNotifyPending = true;

        requestAnimationFrame(function () {
            container.style.opacity = '0.999999';
            _scrollNotifyPending = false;

            requestAnimationFrame(function () {
                bridge.notify_scroll();
                container.style.opacity = '1';
                _repaintPending = false;
            });
        });
    }, {passive: true});

    function autoWrapLatex(text) {
        text = text.replace(/\[\s*((?:[^\[\]]|\[[^\[\]]*\])*?)\s*\]/g, function(match, inner) {
            if (/\\[a-zA-Z]+/.test(inner)) {
                return '\\[' + inner + '\\]';
            }
            return match;
        });

        var result = '';
        var i = 0;
        var n = text.length;
        var inMath = false;

        while (i < n) {
            var ch = text[i];

            if (ch === '$') {
                var isDouble = text[i + 1] === '$';
                var delim = isDouble ? '$$' : '$';

                result += delim;
                i += delim.length;
                inMath = !inMath;
                continue;
            }

            if (!inMath && ch === '\\\\') {
                var m = /^\\\\([a-zA-Z]+)/.exec(text.slice(i));

                if (m && MATH_COMMANDS.indexOf(m[1]) !== -1) {
                    var start = i;
                    var j = i + m[0].length;

                    while (j < n && (text[j] === '{' || text[j] === '[')) {
                        var open = text[j];
                        var close = open === '{' ? '}' : ']';
                        var depth = 1;

                        j++;

                        while (j < n && depth > 0) {
                            if (text[j] === open) depth++;
                            else if (text[j] === close) depth--;
                            j++;
                        }
                    }

                    result += '\\\\(' + text.slice(start, j) + '\\\\)';
                    i = j;
                    continue;
                }
            }

            result += ch;
            i++;
        }

        return result;
    }

    marked.setOptions({
        breaks: true,
        gfm: true
    });

    function renderMarkdown(text) {
        return marked.parse(autoWrapLatex(text));
    }

    function scrollToBottom() {
        container.scrollTop = container.scrollHeight;
    }

    function typesetAndScroll(el) {
        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise([el]).then(scrollToBottom).catch(scrollToBottom);
        } else {
            window.addEventListener('MathJaxReady', function once() {
                window.removeEventListener('MathJaxReady', once);

                MathJax.typesetPromise([el]).then(scrollToBottom).catch(scrollToBottom);
            });

            scrollToBottom();
        }
    }

    function addThinking(id) {
        var row = document.createElement('div');
        row.className = 'row ai';

        var bubble = document.createElement('div');
        bubble.id = id;
        bubble.className = 'bubble ai thinking';
        bubble.innerHTML =
            '<span class="dot"></span>' +
            '<span class="dot"></span>' +
            '<span class="dot"></span>';

        row.appendChild(bubble);
        container.appendChild(row);
        scrollToBottom();
    }

    function setMessage(id, text) {
        var bubble = document.getElementById(id);
        if (!bubble) return;

        bubble.classList.remove('thinking');
        bubble.innerHTML = renderMarkdown(text);
        typesetAndScroll(bubble);
    }

    function addMessage(id, text, isUser) {
        var row = document.createElement('div');
        row.className = 'row ' + (isUser ? 'user' : 'ai');

        var bubble = document.createElement('div');
        bubble.id = id;
        bubble.className = 'bubble ' + (isUser ? 'user' : 'ai');

        bubble.innerHTML = renderMarkdown(text);

        row.appendChild(bubble);
        container.appendChild(row);

        if (isUser) {
            scrollToBottom();
        } else {
            typesetAndScroll(bubble);
        }
    }
</script>
</body>
</html>
